<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E74B5"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#FFFFFF"/>
  <!-- forward arrow -->
  <path d="M 110,120 L 790,120" fill="none" stroke="#2E74B5" stroke-width="6" marker-end="url(#arrB)"/>
  <text x="450" y="95" text-anchor="middle" font-size="26" font-weight="bold" fill="#2E74B5">forward pass: compute &#375;</text>
  <!-- backward arrow -->
  <path d="M 790,560 L 110,560" fill="none" stroke="#C00000" stroke-width="6" marker-end="url(#arrR)"/>
  <text x="450" y="605" text-anchor="middle" font-size="26" font-weight="bold" fill="#C00000">backward pass: gradients &#8706;L/&#8706;w, then w &#8592; w &#8722; &#951;&#183;&#8706;L/&#8706;w</text>
  <!-- connections -->
  <g stroke="#9DC3E6" stroke-width="2">
    <line x1="146" y1="220" x2="294" y2="170"/><line x1="146" y1="220" x2="294" y2="330"/><line x1="146" y1="220" x2="294" y2="490"/>
    <line x1="146" y1="440" x2="294" y2="170"/><line x1="146" y1="440" x2="294" y2="330"/><line x1="146" y1="440" x2="294" y2="490"/>
    <line x1="366" y1="170" x2="514" y2="330"/><line x1="366" y1="330" x2="514" y2="330"/><line x1="366" y1="490" x2="514" y2="330"/>
  </g>
  <!-- nodes -->
  <g fill="#DEEBF7" stroke="#2E74B5" stroke-width="3">
    <circle cx="110" cy="220" r="36"/><circle cx="110" cy="440" r="36"/>
    <circle cx="330" cy="170" r="36"/><circle cx="330" cy="330" r="36"/><circle cx="330" cy="490" r="36"/>
    <circle cx="550" cy="330" r="36"/>
  </g>
  <text x="550" y="340" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">&#375;</text>
  <text x="110" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">x</text>
  <text x="110" y="450" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">x</text>
  <!-- loss box -->
  <rect x="700" y="270" width="230" height="120" rx="14" fill="#FBE0E0" stroke="#C00000" stroke-width="3"/>
  <text x="815" y="320" text-anchor="middle" font-size="28" font-weight="bold" fill="#C00000">Loss L(&#375;, y)</text>
  <text x="815" y="362" text-anchor="middle" font-size="20" fill="#595959">how wrong are we?</text>
  <line x1="586" y1="330" x2="700" y2="330" stroke="#C00000" stroke-width="4" marker-end="url(#arrR)"/>
</svg>
