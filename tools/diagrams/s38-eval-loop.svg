  <path d="M 345,615 C 250,615 205,520 205,425" fill="none" stroke="#2E74B5" stroke-width="6" marker-end="url(#arrB)"/>
  <path d="M 205,285 C 205,190 250,85 345,85" fill="none" stroke="#C00000" stroke-width="6" stroke-dasharray="14,10" marker-end="url(#arrB)"/>
  <!-- boxes -->
