  <rect x="630" y="305" width="330" height="120" rx="14" fill="#DEEBF7" stroke="#2E74B5" stroke-width="3"/>
  <text x="795" y="355" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F3864">Predictions on</text>
  <text x="795" y="395" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F3864">test data</text>
  <rect x="320" y="560" width="360" height="120" rx="14" fill="#DEEBF7" stroke="#2E74B5" stroke-width="3"/>
  <text x="500" y="608" text-anchor="middle" font-size="29" font-weight="bold" fill="#1F3864">Metrics: precision,</text>
  <text x="500" y="648" text-anchor="middle" font-size="29" font-weight="bold" fill="#1F3864">recall, F1</text>
  <rect x="40" y="305" width="330" height="120" rx="14" fill="#DEEBF7" stroke="#2E74B5" stroke-width="3"/>
  <text x="205" y="355" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F3864">Business</text>
